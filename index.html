<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Itinera Mundi — Mappa Interattiva</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gold: {
              400: '#f3e5ab',
              500: '#d4af37',
              600: '#aa820a',
            },
            darksurface: '#121212',
            darkcard: '#1a1a1a',
          },
          fontFamily: {
            cinzel: ['Cinzel', 'serif'],
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0b0b;
      color: #e5e5e5;
      overflow: hidden;
    }
    .font-cinzel { font-family: 'Cinzel', serif; }
    
    /* Custom Leaflet Dark Theme Overrides */
    .leaflet-container {
      background: #0b0b0b !important;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background: #1a1a1a !important;
      color: #f3e5ab !important;
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.8);
    }
    .leaflet-popup-content {
      margin: 14px 18px;
      line-height: 1.5;
    }
    .leaflet-container a.leaflet-popup-close-button {
      color: #d4af37 !important;
      padding: 8px;
    }

    /* Custom Scrollbar for Luxury Panel */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #121212;
    }
    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #d4af37;
    }

    /* Gold Glow Animation */
    @keyframes goldPulse {
      0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(212, 175, 55, 0); }
      100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
    }
    .gps-active {
      animation: goldPulse 2s infinite;
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col md:flex-row relative">

  <!-- SIDEBAR / STAGES PANEL -->
  <div class="w-full md:w-[420px] h-[45%] md:h-full bg-darkcard/95 backdrop-blur-md border-b md:border-b-0 md:border-r border-gold-500/20 flex flex-col z-20 shadow-2xl">
    <!-- Brand Header -->
    <div class="p-5 border-b border-gold-500/20 flex items-center justify-between bg-gradient-to-r from-darkcard to-black">
      <div>
        <span class="text-xs uppercase tracking-[0.25em] text-gold-500 font-semibold">Roma Experiential Map</span>
        <h1 class="font-cinzel text-xl text-gold-400 font-bold tracking-wide mt-0.5">Itinera Mundi</h1>
      </div>
      <button id="locate-btn" class="bg-gold-500/10 hover:bg-gold-500/20 text-gold-400 border border-gold-500/40 p-2.5 rounded-xl transition-all flex items-center justify-center text-sm shadow-lg" title="Attiva GPS">
        <i class="fa-solid fa-location-crosshairs text-lg"></i>
      </button>
    </div>

    <!-- Stages List Container -->
    <div id="stages-list" class="flex-1 overflow-y-auto p-4 space-y-3">
      <!-- Le tappe verranno inserite dinamicamente via JS -->
    </div>
    
    <!-- Footer Info -->
    <div class="p-3 px-5 border-t border-gold-500/10 text-center text-[11px] text-neutral-400 bg-black/40">
      Seleziona una tappa o usa il GPS per iniziare l'esplorazione
    </div>
  </div>

  <!-- MAP CONTAINER -->
  <div id="map" class="flex-1 h-[55%] md:h-full z-10"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    // Dati delle tappe di Roma (dal Pincio / Centro Storico al Colosseo)
    const stages = [
      {
        id: 1,
        title: "Tappa 1: Terrazza del Pincio",
        subtitle: "Il punto di partenza panoramico",
        desc: "Goditi la vista mozzafiato su Piazza del Popolo e sui tetti di Roma prima di iniziare il cammino.",
        lat: 41.9117,
        lng: 12.4786,
        clue: "Cerca la balaustra che affaccia sull'obelisco."
      },
      {
        id: 2,
        title: "Tappa 2: Trinità dei Monti & Piazza di Spagna",
        subtitle: "Eleganza barocca",
        desc: "La celebre scalinata monumentale nel cuore della Roma storica.",
        lat: 41.9057,
        lng: 12.4823,
        clue: "Osserva la Barcaccia alla base dei gradini."
      },
      {
        id: 3,
        title: "Tappa 3: Fontana di Trevi",
        subtitle: "Il capolavoro dell'acqua",
        desc: "Il celebre monumento barocco dove esprimere il desiderio di ritorno nell'Urbe.",
        lat: 41.9009,
        lng: 12.4833,
        clue: "Ascolta il fragore dell'acqua tra i vicoli stretti."
      },
      {
        id: 4,
        title: "Tappa 4: Pantheon",
        subtitle: "La meraviglia ingegneristica",
        desc: "Il tempio di tutti gli dèi con la sua cupola in calcestruzzo non armato più grande al mondo.",
        lat: 41.8986,
        lng: 12.4768,
        clue: "Guarda l'oculo aperto verso il cielo."
      },
      {
        id: 5,
        title: "Tappa 5: Piazza Navona",
        subtitle: "L'antico stadio di Domiziano",
        desc: "Piazza barocca celebre per la Fontana dei Quattro Fiumi di Bernini.",
        lat: 41.8992,
        lng: 12.4731,
        clue: "Trova il fiume che copre gli occhi."
      },
      {
        id: 6,
        title: "Tappa 6: Campo de' Fiori",
        subtitle: "Storia e vivacità popolare",
        desc: "Piazza animata dominata dalla statua di Giordano Bruno.",
        lat: 41.8955,
        lng: 12.4719,
        clue: "Cerca il monumento al filosofo nel centro della piazza."
      },
      {
        id: 7,
        title: "Tappa 7: Largo di Torre Argentina",
        subtitle: "Il tempio dei felini e di Cesare",
        desc: "L'area sacra repubblicana e luogo storico della congiura di Giulio Cesare.",
        lat: 41.8955,
        lng: 12.4768,
        clue: "Osserva i resti dei templi antichi sotto il livello stradale."
      },
      {
        id: 8,
        title: "Tappa 8: Campidoglio",
        subtitle: "Il colle di Michelangelo",
        desc: "La splendida piazza progettata da Michelangelo affacciata sui Fori Imperiali.",
        lat: 41.8934,
        lng: 12.4828,
        clue: "Cerca la statua equestre di Marco Aurelio al centro."
      },
      {
        id: 9,
        title: "Tappa 9: Via dei Fori Imperiali",
        subtitle: "La passeggiata archeologica",
        desc: "Viale monumentale che unisce Piazza Venezia al Colosseo tra i resti dei fori.",
        lat: 41.8920,
        lng: 12.4853,
        clue: "Cammina ammirando i templi illuminati."
      },
      {
        id: 10,
        title: "Tappa 10: Arco di Costantino",
        subtitle: "Trionfo imperiale",
        desc: "Il magnifico arco di trionfo situato a due passi dall'anfiteatro.",
        lat: 41.8899,
        lng: 12.4900,
        clue: "Osserva i bassorilievi che raccontano le battaglie."
      },
      {
        id: 11,
        title: "Tappa 11: Il Colosseo",
        subtitle: "Traguardo finale",
        desc: "Il simbolo eterno di Roma e l'anfiteatro più grande del mondo antico.",
        lat: 41.8902,
        lng: 12.4922,
        clue: "Hai completato l'Itinera Mundi di Roma!"
      }
    ];

    // Inizializzazione della mappa centrata su Roma (stile Dark CartoDB)
    const map = L.map('map', {
      zoomControl: false
    }).setView([41.9010, 12.4800], 14);

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Layer CartoDB Dark Matter (perfetto per il tema dark/gold)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://carto.com/">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    let markers = [];
    let polyline = null;
    let userMarker = null;
    let userCircle = null;

    // Creazione dei marker personalizzati color oro
    const goldIcon = L.divIcon({
      className: 'custom-gold-marker',
      html: '<div style="background-color: #d4af37; width: 28px; height: 28px; border-radius: 50%; border: 2px solid #000; display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold; font-size: 12px; box-shadow: 0 0 10px rgba(212,175,55,0.6);"></div>',
      iconSize: [28, 28],
      iconAnchor: [14, 14]
    });

    const listContainer = document.getElementById('stages-list');

    // Funzione per disegnare la linea di percorso tra le tappe
    function drawRoute() {
      const latLngs = stages.map(s => [s.lat, s.lng]);
      if (polyline) map.removeLayer(polyline);
      polyline = L.polyline(latLngs, {
        color: '#d4af37',
        weight: 3,
        opacity: 0.6,
        dashArray: '6, 8'
      }).addTo(map);
    }

    // Popola la lista laterale e posiziona i marker sulla mappa
    stages.forEach((stage, index) => {
      // Modifica l'icona HTML interna con il numero della tappa
      const numberedIcon = L.divIcon({
        className: 'custom-gold-marker',
        html: `<div style="background-color: #1a1a1a; color: #d4af37; width: 30px; height: 30px; border-radius: 50%; border: 2px solid #d4af37; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; font-family: 'Cinzel', serif; box-shadow: 0 0 12px rgba(212,175,55,0.5);">${index + 1}</div>`,
        iconSize: [30, 30],
        iconAnchor: [15, 15]
      });

      const marker = L.marker([stage.lat, stage.lng], { icon: numberedIcon }).addTo(map);
      
      marker.bindPopup(`
        <div style="font-family: 'Plus Jakarta Sans', sans-serif;">
          <span style="color: #d4af37; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600;">Tappa ${index + 1} di 11</span>
          <h3 style="font-family: 'Cinzel', serif; font-size: 16px; font-weight: 700; color: #f3e5ab; margin: 4px 0 8px 0;">${stage.title.split(': ')[1] || stage.title}</h3>
          <p style="font-size: 13px; color: #ccc; margin-bottom: 8px;">${stage.desc}</p>
          <div style="font-size: 12px; color: #d4af37; background: rgba(212,175,55,0.1); padding: 6px 10px; border-radius: 6px; border-left: 2px solid #d4af37;">
            <i class="fa-solid fa-compass"></i> <strong>Indizio:</strong> ${stage.clue}
          </div>
        </div>
      `);

      markers.push(marker);

      // Elemento nella sidebar
      const itemEl = document.createElement('div');
      itemEl.className = "bg-darksurface hover:bg-black/60 border border-gold-500/20 hover:border-gold-500/60 p-3.5 rounded-xl transition-all cursor-pointer group shadow-sm";
      itemEl.innerHTML = `
        <div class="flex items-start justify-between">
          <div class="flex items-center space-x-3">
            <span class="w-7 h-7 rounded-full bg-gold-500/10 border border-gold-500/40 text-gold-400 font-cinzel text-xs flex items-center justify-center font-bold group-hover:bg-gold-500 group-hover:text-black transition-all">${index + 1}</span>
            <div>
              <h4 class="text-sm font-semibold text-gold-400 group-hover:text-gold-300 transition-colors">${stage.title}</h4>
              <p class="text-xs text-neutral-400 mt-0.5">${stage.subtitle}</p>
            </div>
          </div>
          <i class="fa-solid fa-chevron-right text-xs text-neutral-600 group-hover:text-gold-400 transition-colors self-center"></i>
        </div>
      `;

      itemEl.addEventListener('click', () => {
        map.flyTo([stage.lat, stage.lng], 17, { duration: 1.2 });
        marker.openPopup();
        
        // Evidenziazione visiva della card selezionata
        document.querySelectorAll('#stages-list > div').forEach(el => el.classList.remove('border-gold-500', 'bg-gold-500/5'));
        itemEl.classList.add('border-gold-500', 'bg-gold-500/5');
      });

      listContainer.appendChild(itemEl);
    });

    drawRoute();

    // Geolocalizzazione GPS Live dell'utente
    const locateBtn = document.getElementById('locate-btn');
    let trackingActive = false;

    locateBtn.addEventListener('click', () => {
      if (!navigator.geolocation) {
        alert("La geolocalizzazione non è supportata dal tuo browser.");
        return;
      }

      locateBtn.classList.add('gps-active', 'bg-gold-500/30');
      
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const accuracy = position.coords.
